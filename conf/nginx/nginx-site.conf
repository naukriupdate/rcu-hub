server {
    listen   80;
    listen   [::]:80 default ipv6only=on;

    # Laravel public directory as web root (overridden by WEBROOT env in start.sh)
    root /var/www/html/public;
    index index.php index.html index.htm;

    server_name _;

    # Send logs to stdout/stderr for Render log streaming
    error_log  /dev/stderr warn;
    access_log /dev/stdout;

    sendfile off;

    # Security: block git metadata exposure
    location /.git {
        deny all;
        return 403;
    }

    # -----------------------------------------------------------------------
    # THE CORE FIX:
    # try_files now falls through to /index.php?$query_string instead of =404.
    # This is the standard Laravel/Nginx try_files pattern.
    # Without this, Nginx returns 404 for any route that isn't a real file
    # (e.g. /login, /courses, /resources, /notices).
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP files to PHP-FPM
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        include fastcgi_params;

        # Longer timeouts for slow first cold-start requests on Render free tier
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Serve Vite build assets and other static files with long cache headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|map)$ {
        expires max;
        log_not_found off;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Block access to hidden files (except .well-known for Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Custom error page (uses richarvey image's built-in error pages)
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/errors;
        internal;
    }

    location ^~ /sad.svg {
        alias /var/www/errors/sad.svg;
    }
}
